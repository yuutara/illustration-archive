<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图标方向 · 插画档案</title>
<style>
    :root { --paper: #f6f6f5; --card: #fff; --ink: #1b1b1a; --muted: #6a6a65; --line: #e2e2df; --accent: #3550d4; }
    @media (prefers-color-scheme: dark) { :root { --paper: #111; --card: #1a1a1a; --ink: #ededeb; --muted: #9c9c95; --line: #2c2c2b; --accent: #a8b7ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 24px 64px; color: var(--ink); background: var(--paper); font: 14px/1.6 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif; }
    main { max-width: 1080px; margin: 0 auto; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .lead { margin: 4px 0 24px; color: var(--muted); }
    .direction { padding: 20px 0; border-top: 1px solid var(--line); }
    .direction h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .direction > p { margin: 2px 0 12px; color: var(--muted); }
    .strips { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
    .strip { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 8px; overflow: hidden; }
    .strip.light { background: #f3f3f3; }
    .strip.dark { background: #202020; }
    .strip svg { flex: none; }
    .shortcut { display: grid; justify-items: center; gap: 2px; width: 76px; margin-left: auto; font-size: 12px; text-align: center; }
    .light .shortcut { color: #1b1b1a; }
    .dark .shortcut { color: #f3f3f3; }
    .prompt { position: relative; margin-top: 10px; }
    .prompt h3 { margin: 0 0 4px; color: var(--muted); font-size: 13px; font-weight: 400; }
    .prompt pre { margin: 0; padding: 12px 72px 12px 12px; border-radius: 8px; background: var(--card); box-shadow: 0 0 0 1px var(--line); font: 13px/1.5 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .prompt button { position: absolute; right: 8px; top: 30px; height: 28px; padding: 0 10px; border: 0; border-radius: 6px; color: var(--ink); background: var(--paper); cursor: pointer; }
    .prompt button:hover { color: var(--accent); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="a" viewBox="0 0 256 256">
        <rect x="58" y="50" width="124" height="172" rx="16" fill="#2638a8" transform="rotate(-13 120 136)"/>
        <rect x="66" y="44" width="124" height="172" rx="16" fill="#93a4f2" transform="rotate(-5 128 130)"/>
        <rect x="78" y="34" width="132" height="186" rx="16" fill="#1a2469"/>
        <path d="M94 34h100a16 16 0 0 1 16 16v82c-70 50-98-14-132 22V50a16 16 0 0 1 16-16Z" fill="#f7f4ec"/>
        <circle cx="170" cy="84" r="20" fill="#d8442f"/>
    </symbol>
    <symbol id="b" viewBox="0 0 256 256">
        <rect x="20" y="20" width="216" height="216" rx="44" fill="#c23a2a"/>
        <rect x="44" y="44" width="168" height="168" rx="22" fill="none" stroke="#f7f4ec" stroke-width="10"/>
        <path d="M72 150c34-30 54 22 112-14v42a10 10 0 0 1-10 10H82a10 10 0 0 1-10-10Z" fill="#f7f4ec"/>
        <rect x="150" y="74" width="34" height="34" rx="6" fill="#f7f4ec"/>
    </symbol>
    <symbol id="c" viewBox="0 0 256 256">
        <rect x="16" y="16" width="224" height="224" rx="40" fill="#1a2469"/>
        <rect x="34" y="34" width="188" height="188" rx="24" fill="#f7f4ec"/>
        <rect x="68" y="68" width="120" height="120" rx="8" fill="#3550d4"/>
        <circle cx="154" cy="102" r="16" fill="#d8442f"/>
        <path d="M68 150c34-24 62 18 120-12v42a8 8 0 0 1-8 8H76a8 8 0 0 1-8-8Z" fill="#1a2469"/>
    </symbol>
    <symbol id="d" viewBox="0 0 256 256">
        <rect x="76" y="26" width="128" height="150" rx="14" fill="#f7f4ec" transform="rotate(5 140 100)"/>
        <rect x="156" y="52" width="26" height="26" rx="5" fill="#d8442f" transform="rotate(5 169 65)"/>
        <path d="M28 84a18 18 0 0 1 18-18h52a18 18 0 0 1 14 7l12 15h86a18 18 0 0 1 18 18v94a24 24 0 0 1-24 24H52a24 24 0 0 1-24-24Z" fill="#3550d4"/>
        <rect x="28" y="150" width="200" height="10" fill="#1a2469"/>
    </symbol>
</defs></svg>

<main>
    <h1>图标方向</h1>
    <p class="lead">矢量草案，只用来比较方向，未接入应用。每行依次是 96、48、36、30、24、16 px 和桌面快捷方式。</p>
    <div id="directions"></div>
</main>

<script>
    const SIZES = [96, 48, 36, 30, 24, 16];
    const COMMON = 'No text, no letters, transparent background, centered, 1024x1024';
    const DIRECTIONS = [
        {
            id: 'a', name: 'A 牌堆', note: '现图标去掉蓝底板。取自图库的循环牌堆，稳妥的演进方向。',
            prompts: [
                ['A1 扁平', `Windows 11 app icon for an illustration archive. Three slightly fanned portrait art cards, seen from the front, no background plate. Front card: warm paper upper half, deep navy wave across the lower half, one small vermilion circle like a sun. Rear cards: ultramarine and periwinkle, tilted a few degrees. Flat vector, crisp geometric edges, soft rounded corners, very subtle depth only. Palette: #3550D4, #1A2469, #93A4F2, #F7F4EC, #D8442F. No people, no gradients. ${COMMON}, must stay legible at 32 pixels.`],
                ['A2 轻立体', `Premium Windows 11 Fluent style app icon. A small stack of three portrait art prints, gently fanned, thick matte paper with soft directional light from top left. Top print shows a calm abstract navy wave and a small vermilion sun, not a photo. Ultramarine and warm paper palette, restrained and elegant, like a museum print. Soft contact shadow only, no glow, no gloss. ${COMMON}.`]
            ]
        },
        {
            id: 'b', name: 'B 收藏印', note: '鉴藏印是“收藏”最直接的文化符号，任务栏里最醒目。想用真字要手工刻，小尺寸需简化。',
            prompts: [
                ['B1 朱文', `Minimal app icon in the form of a traditional East Asian collector's seal. A rounded square vermilion seal #C23A2A with a thin carved paper-coloured inner border. Inside, carved in negative space, one abstract mark: a single flowing wave line under a small square, not a real character, no calligraphy. Slightly uneven hand-carved edge, flat, very restrained, museum quality. Colours only #C23A2A and #F7F4EC. ${COMMON}, legible at 32 pixels.`],
                ['B2 印上画作', `App icon: a portrait art print on warm paper #F7F4EC with a calm abstract ultramarine wave, and a small vermilion collector's seal stamped in the lower right corner, slightly overlapping the edge of the print. The seal is a simple rounded square with an abstract carved mark and no real characters. Flat vector, generous negative space, gallery aesthetic, no border plate. ${COMMON}.`]
            ]
        },
        {
            id: 'c', name: 'C 画框', note: '对应“静展”，三层嵌套在 16 px 下最清楚，但容易接近通用的图片占位图标。',
            prompts: [
                ['C1 画框', `Windows app icon of a single framed print seen straight on. Thin deep navy frame #1A2469, wide warm paper mat #F7F4EC, and an ultramarine #3550D4 print window with a calm abstract wave and a small vermilion sun. Strict geometry, flat vector, quiet gallery mood, no mountains, no photo placeholder look. ${COMMON}, legible at 16 pixels.`]
            ]
        },
        { id: 'd', name: 'D 画册夹', note: '强调“档案”，但和资源管理器的文件夹太接近，不推荐。', prompts: [] }
    ];

    const icon = (id, size) => `<svg width="${size}" height="${size}" aria-hidden="true"><use href="#${id}"/></svg>`;
    const strip = (id, tone) => `<div class="strip ${tone}">${SIZES.map((size) => icon(id, size)).join('')}<span class="shortcut">${icon(id, 48)}插画档案</span></div>`;

    document.getElementById('directions').innerHTML = DIRECTIONS.map((direction) => `
        <section class="direction">
            <h2>${direction.name}</h2>
            <p>${direction.note}</p>
            <div class="strips">${strip(direction.id, 'light')}${strip(direction.id, 'dark')}</div>
            ${direction.prompts.map(([name, text]) => `
                <div class="prompt">
                    <h3>${name}</h3>
                    <pre>${text}</pre>
                    <button type="button">复制</button>
                </div>`).join('')}
        </section>`).join('');

    document.addEventListener('click', (event) => {
        if (event.target.tagName !== 'BUTTON') return;
        const button = event.target;
        navigator.clipboard.writeText(button.previousElementSibling.textContent)
            .then(() => { button.textContent = '已复制'; })
            .catch(() => { button.textContent = '请手动选中复制'; });
        setTimeout(() => { button.textContent = '复制'; }, 1500);
    });
</script>
</body>
</html>
