<!doctype html>
<html lang="zh-CN" data-look="quiet" data-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="darkreader-lock">
    <meta name="color-scheme" content="light dark">
    <title>回收站 · 插画档案</title>
    <link rel="icon" type="image/svg+xml" href="app-icon.svg">
    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" href="motion.css">
    <link rel="stylesheet" href="theme-quiet.css">
    <link rel="stylesheet" href="c.css">
    <link rel="stylesheet" href="app.css">
    <script src="theme-mode.js"></script>
    <script src="/ui-capabilities.js"></script>
    <script>if (window.UiCapabilities && UiCapabilities.desktop) document.documentElement.classList.add('is-desktop');</script>
    <script src="shell.js" defer></script>
    <script src="c-close.js" defer></script>
    <script src="c-trash.js" defer></script>
</head>
<body>
<header class="masthead" id="masthead">
    <div class="mast-start">
        <a class="wordmark" href="/c/">插画档案</a>
        <nav class="mast-nav" aria-label="主导航">
            <a href="/c/">图库</a>
            <a href="/c/x.html">X 收藏<sup id="nav-inbox"></sup></a>
            <a class="desktop-only" href="/c/trash.html" aria-current="page">回收站<sup id="nav-trash"></sup></a>
            <a href="/c/settings.html">设置</a>
        </nav>
    </div>
    <div class="mast-end">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深浅色" aria-pressed="false" title="切换深浅色">
            <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
    </div>
</header>

<main class="app-page">
    <div class="app-head">
        <div class="app-head-title">
            <h1>回收站</h1>
            <span class="app-head-count" id="trash-count" aria-live="polite"></span>
        </div>
        <div class="app-head-actions">
            <button class="btn" id="trash-select-page" type="button" hidden>全选本页</button>
            <button class="btn btn-danger" id="trash-empty-btn" type="button" hidden>清空回收站…</button>
        </div>
    </div>

    <p class="trash-note" id="trash-note">移入回收站的作品会暂存在这里；30 天后自动永久清理，清理前可以随时恢复原样。</p>

    <div class="state-empty" id="trash-loading" hidden>
        <p>正在读取回收站…</p>
    </div>

    <div class="state-empty" id="trash-error" hidden>
        <p id="trash-error-text"></p>
        <button class="btn" id="trash-retry" type="button">再试一次</button>
    </div>

    <div class="state-empty" id="trash-empty" hidden>
        <p class="empty-title" id="trash-empty-title">回收站是空的</p>
        <p id="trash-empty-text">从图库或看图器移入回收站的作品会出现在这里。</p>
        <a class="btn" id="trash-back-link" href="/c/" hidden>回到图库</a>
    </div>

    <section class="trash-grid" id="trash-grid" aria-label="回收站作品列表"></section>

    <nav class="x-pager" id="trash-pager" aria-label="分页" hidden>
        <button class="btn" id="trash-prev" type="button">上一页</button>
        <span id="trash-page"></span>
        <button class="btn" id="trash-next" type="button">下一页</button>
    </nav>
</main>

<div class="batchbar" id="trash-bar" role="toolbar" aria-label="回收站批量操作" hidden>
    <span class="bb-count" id="trash-selected" aria-live="polite"></span>
    <button class="bb-btn" id="trash-clear-btn" type="button">取消</button>
    <span class="bb-sep" aria-hidden="true"></span>
    <button class="bb-btn bb-primary" id="trash-restore-btn" type="button">恢复</button>
    <button class="bb-btn danger" id="trash-purge-btn" type="button">永久删除…</button>
</div>

<div class="sheet-backdrop" id="trash-confirm" hidden>
    <section class="sheet sheet-small" role="alertdialog" aria-modal="true" aria-labelledby="trash-confirm-title" aria-describedby="trash-confirm-text">
        <h2 id="trash-confirm-title"></h2>
        <p class="trash-confirm-warning" id="trash-confirm-text"></p>
        <p class="set-error" id="trash-confirm-error" role="alert" hidden></p>
        <div class="sheet-foot">
            <button class="btn" id="trash-confirm-cancel" type="button">先留着</button>
            <button class="btn btn-danger" id="trash-confirm-ok" type="button"></button>
        </div>
    </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10Z"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
    </defs>
</svg>
</body>
</html>
