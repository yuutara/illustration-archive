<!doctype html>
<html lang="zh-CN" data-look="quiet" data-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="darkreader-lock">
    <meta name="color-scheme" content="light dark">
    <!-- 图片直接来自 X 的 CDN，它看到 127.0.0.1 / localhost 的 Referer 会返回 351 Forbidden -->
    <meta name="referrer" content="no-referrer">
    <title>X 收藏 · 插画档案</title>
    <link rel="icon" type="image/svg+xml" href="app-icon.svg">
    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" href="motion.css">
    <link rel="stylesheet" href="theme-quiet.css">
    <link rel="stylesheet" href="c.css">
    <link rel="stylesheet" href="app.css">
    <script src="theme-mode.js"></script>
    <script src="/ui-capabilities.js"></script>
    <script>if (window.UiCapabilities && UiCapabilities.desktop) document.documentElement.classList.add('is-desktop');</script>
    <script src="shell.js" defer></script>
    <script src="c-close.js" defer></script>
    <script src="c-x-model.js" defer></script>
    <script src="c-x.js" defer></script>
</head>
<body>
<header class="masthead masthead-page">
    <div class="mast-start">
        <a class="wordmark" href="/c/">插画档案</a>
        <nav class="mast-nav" aria-label="主导航">
            <a href="/c/">图库</a>
            <a href="/c/x.html" aria-current="page">X 收藏<sup id="nav-inbox"></sup></a>
            <a href="/c/settings.html">设置</a>
        </nav>
    </div>
    <div class="mast-actions">
        <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="切换浅色 / 深色">
            <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
    </div>
</header>

<main class="app-page">
    <header class="app-head">
        <div>
            <h1>X 收藏</h1>
            <p id="x-count" aria-live="polite"></p>
        </div>
        <div class="app-head-actions">
            <button class="btn" id="x-select-page" type="button" hidden>全选本页</button>
            <button class="btn btn-ink" id="x-sync" type="button" hidden>同步</button>
        </div>
    </header>

    <div class="x-result" id="x-result" role="status" hidden>
        <p class="x-result-head" id="x-result-head"></p>
        <p id="x-result-detail"></p>
        <div class="x-result-actions" id="x-result-actions"></div>
    </div>

    <section class="x-connect" id="x-connect" hidden>
        <h2>连接 X 账号后才能同步收藏</h2>
        <p>通过浏览器登录授权，应用不会看到你的密码。X 的读取按量计费，费用记在你自己的开发者账号上。</p>
        <a class="btn btn-ink" href="/c/settings.html#x">去连接</a>
    </section>

    <p class="x-loading" id="x-loading">正在载入…</p>
    <div class="empty" id="x-empty" hidden>
        <p class="empty-title">收件箱是空的</p>
        <p id="x-empty-text">同步后，待整理的收藏会出现在这里。</p>
    </div>
    <div class="x-grid" id="x-grid"></div>
    <nav class="x-pager" id="x-pager" aria-label="分页" hidden>
        <button class="btn" id="x-prev" type="button">上一页</button>
        <span id="x-page"></span>
        <button class="btn" id="x-next" type="button">下一页</button>
    </nav>
</main>

<div class="batchbar" id="x-bar" role="toolbar" aria-label="批量操作" hidden>
    <span class="bb-count" id="x-selected" aria-live="polite"></span>
    <button class="bb-btn" id="x-clear" type="button">清除</button>
    <span class="bb-sep" aria-hidden="true"></span>
    <button class="bb-btn" id="x-skip" type="button" title="不归档，从收件箱移走（S）">跳过</button>
    <button class="bb-btn bb-primary" id="x-archive" type="button" title="下载原图并存入图库（A）">归档</button>
</div>

<!-- 预览：逐件过，A 归档、S 跳过后自动到下一件 -->
<div class="x-preview" id="x-preview" role="dialog" aria-modal="true" aria-label="预览" tabindex="-1" hidden>
    <div class="x-stage" id="x-stage"></div>
    <aside class="x-side">
        <header>
            <p class="x-side-author" id="x-side-author"></p>
            <p class="x-side-handle" id="x-side-handle"></p>
        </header>
        <p class="x-side-text" id="x-side-text"></p>
        <p class="x-side-meta" id="x-side-meta"></p>
        <p class="x-side-problem" id="x-side-problem" hidden></p>
        <a class="link" id="x-side-open" data-external target="_blank" rel="noreferrer">在 X 上打开</a>
        <footer>
            <button class="btn btn-ink" id="x-side-archive" type="button">归档 <kbd>A</kbd></button>
            <button class="btn" id="x-side-skip" type="button">跳过 <kbd>S</kbd></button>
            <button class="btn" id="x-side-close" type="button">关闭 <kbd>Esc</kbd></button>
        </footer>
    </aside>
</div>

<div class="sheet-backdrop" id="x-confirm" hidden>
    <section class="sheet sheet-small" role="alertdialog" aria-modal="true" aria-labelledby="x-confirm-title" aria-describedby="x-confirm-text">
        <h2 id="x-confirm-title">同步会产生 X API 费用</h2>
        <p id="x-confirm-text"></p>
        <div class="sheet-foot">
            <button class="btn" id="x-confirm-cancel" type="button">取消</button>
            <button class="btn btn-ink" id="x-confirm-ok" type="button">继续同步</button>
        </div>
    </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10Z"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
    </defs>
</svg>
</body>
</html>
