<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>插画详情 · Illustration Archive</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css">
    <script src="/image-viewer.js" defer></script>
    <script src="/browse-context.js" defer></script>
    <script src="/metadata-picker.js" defer></script>
    <script src="/detail.js" defer></script>
</head>
<body class="detail-page">
<main class="page-shell detail-shell">
    <header class="detail-header">
        <a id="detail-back-link" class="back-link" href="/">← 返回图库</a>
        <p id="detail-status" class="load-status" aria-live="polite">正在加载…</p>
        <button class="theme-toggle" type="button" aria-pressed="false" hidden>深色模式</button>
    </header>

    <div id="detail-state-panel" class="state-panel" role="status" hidden>
        <h3 id="detail-state-title"></h3>
        <p id="detail-state-message"></p>
        <button id="detail-retry-button" class="secondary-button" type="button" hidden>重新加载</button>
    </div>

    <article id="detail-content" class="detail-content" hidden>
        <div class="detail-hero">
            <div id="detail-images" class="detail-images"></div>
            <div class="detail-information">
            <div class="detail-summary">
                <div class="detail-summary-heading">
                    <div>
                        <h1 id="detail-title"></h1>
                    </div>
                </div>

                <form id="detail-edit-form" class="detail-edit-form" hidden>
                    <div class="detail-edit-fields">
                        <label class="detail-field" for="detail-title-input">
                            <span class="detail-label">标题</span>
                            <input id="detail-title-input" type="text" autocomplete="off">
                        </label>

                        <label class="detail-field" for="detail-source-input">
                            <span class="detail-label">来源链接</span>
                            <input id="detail-source-input" type="text" autocomplete="url">
                        </label>

                        <label class="detail-field" for="detail-note-input">
                            <span class="detail-label">备注</span>
                            <textarea id="detail-note-input" rows="5"></textarea>
                        </label>
                    </div>

                    <section class="detail-author-editor" aria-labelledby="detail-author-edit-label">
                        <span id="detail-author-edit-label" class="detail-label">作者</span>

                        <div class="detail-author-selection-row">
                            <p id="detail-author-selection" class="detail-author-selection" aria-live="polite"></p>
                            <button id="detail-author-toggle" class="secondary-button" type="button" aria-expanded="false" aria-controls="detail-author-panel">选择作者 ▾</button>
                            <button id="detail-author-clear-button" class="secondary-button" type="button">清除作者</button>
                        </div>

                        <div id="detail-author-panel" class="metadata-picker-panel" hidden>
                            <div class="metadata-picker-search">
                                <label class="visually-hidden" for="detail-author-search-input">搜索作者</label>
                                <input id="detail-author-search-input" type="search" placeholder="搜索作者" autocomplete="off">
                                <button id="detail-author-search-button" class="secondary-button" type="button">搜索作者</button>
                            </div>
                            <p id="detail-author-search-status" class="detail-edit-status" aria-live="polite"></p>
                            <ul id="detail-author-search-results" class="metadata-picker-results"></ul>
                            <button id="detail-author-more" class="secondary-button" type="button" hidden>加载更多</button>
                        </div>

                        <div class="detail-author-create-row">
                            <button id="detail-author-create-button" class="secondary-button" type="button">
                                新建作者
                            </button>
                        </div>

                        <div id="detail-author-create-panel" class="detail-author-create-panel" hidden>
                            <div class="detail-author-create-fields">
                                <label class="detail-field" for="detail-author-create-display-name">
                                    <span class="detail-label">作者名称</span>
                                    <input id="detail-author-create-display-name" type="text" autocomplete="off">
                                </label>

                                <label class="detail-field" for="detail-author-create-x-username">
                                    <span class="detail-label">X 用户名（可选）</span>
                                    <input id="detail-author-create-x-username" type="text" autocomplete="off">
                                </label>
                            </div>

                            <div class="detail-author-create-actions">
                                <button id="detail-author-create-submit" class="primary-button" type="button">
                                    创建作者
                                </button>
                                <button id="detail-author-create-cancel" class="secondary-button" type="button">
                                    取消
                                </button>
                            </div>
                            <p id="detail-author-create-status" class="detail-edit-status" aria-live="polite"></p>
                        </div>

                    </section>

                    <section class="detail-tag-editor" aria-labelledby="detail-tag-edit-label">
                        <span id="detail-tag-edit-label" class="detail-label">标签</span>
                        <div id="detail-tag-selection" class="detail-tag-selection" aria-live="polite"></div>

                        <button id="detail-tag-toggle" class="secondary-button" type="button" aria-expanded="false" aria-controls="detail-tag-panel">选择标签 ▾</button>
                        <div id="detail-tag-panel" class="metadata-picker-panel" hidden>
                            <div class="metadata-picker-search">
                                <label class="visually-hidden" for="detail-tag-search-input">搜索标签</label>
                                <input id="detail-tag-search-input" type="search" placeholder="搜索标签" autocomplete="off">
                                <button id="detail-tag-search-button" class="secondary-button" type="button">搜索标签</button>
                            </div>
                            <p id="detail-tag-search-status" class="detail-edit-status" aria-live="polite"></p>
                            <ul id="detail-tag-search-results" class="metadata-picker-results"></ul>
                            <button id="detail-tag-more" class="secondary-button" type="button" hidden>加载更多</button>
                        </div>

                        <div class="detail-tag-create-row">
                            <button id="detail-tag-create-button" class="secondary-button" type="button">
                                新建标签
                            </button>
                        </div>

                        <div id="detail-tag-create-panel" class="detail-tag-create-panel" hidden>
                            <label class="detail-field" for="detail-tag-create-name">
                                <span class="detail-label">标签名称</span>
                                <input id="detail-tag-create-name" type="text" autocomplete="off">
                            </label>

                            <div class="detail-tag-create-actions">
                                <button id="detail-tag-create-submit" class="primary-button" type="button">
                                    创建标签
                                </button>
                                <button id="detail-tag-create-cancel" class="secondary-button" type="button">
                                    取消
                                </button>
                            </div>
                            <p id="detail-tag-create-status" class="detail-edit-status" aria-live="polite"></p>
                        </div>

                    </section>

                    <div class="detail-edit-actions">
                        <button id="detail-save-button" class="primary-button" type="submit">保存</button>
                        <button id="detail-cancel-button" class="secondary-button" type="button">取消</button>
                    </div>
                </form>

                <section class="detail-author-block" aria-labelledby="author-label">
                    <span id="author-label" class="detail-label">作者</span>
                    <p id="detail-author-name" class="detail-author-name"></p>
                    <p id="detail-author-handle" class="detail-author-handle" hidden></p>
                </section>

                <section id="detail-tags-section" aria-label="标签">
                    <div id="detail-tags" class="tag-list"></div>
                </section>
            </div>

        <div id="detail-meta-grid" class="detail-meta-grid">
            <section id="detail-note-section" class="detail-meta-section" aria-labelledby="note-label">
                <span id="note-label" class="detail-label">备注</span>
                <p id="detail-note" class="detail-note"></p>
            </section>

            <section id="detail-source-section" class="detail-meta-section" aria-labelledby="source-label">
                <span id="source-label" class="detail-label">来源</span>
                <div id="detail-source"></div>
            </section>
            <div class="detail-summary-actions">
                <button id="detail-edit-button" class="secondary-button" type="button" hidden>编辑</button>
                <button id="detail-delete-button" class="secondary-button danger-button" type="button" hidden>删除插画</button>
            </div>
        </div>
            </div>
        </div>
    </article>
</main>
</body>
</html>
