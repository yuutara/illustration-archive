<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X Import Inbox · Illustration Archive</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css">
    <script src="/image-viewer.js" defer></script>
    <script src="/browse-context.js" defer></script>
    <script src="/x-import.js" defer></script>
</head>
<body class="inbox-page">
<main class="page-shell">
    <header class="page-header inbox-header">
        <div>
            <a class="back-link" href="/">← Back to Gallery</a>
            <button class="theme-toggle" type="button" aria-pressed="false" hidden>深色模式</button>
            <p class="eyebrow">Illustration Archive</p>
            <h1>X Import Inbox</h1>
            <p class="page-description">查看最近收藏的候选作品，选择导入或跳过。</p>
        </div>
        <button id="sync-button" class="primary-button" type="button">Sync latest Likes</button>
    </header>

    <section aria-label="Inbox 操作">
        <div id="inbox-toolbar" class="inbox-toolbar" role="group" aria-label="当前页处理操作">
            <div class="inbox-selection-summary">
                <span id="inbox-count" class="total-count"></span>
                <span id="inbox-selected-count" role="status" aria-live="polite">本页已选 0 项</span>
            </div>
            <div class="inbox-actions">
                <button id="select-all-button" class="secondary-button" type="button" disabled><span class="inbox-long-label">Select Page</span><span class="inbox-short-label">选本页</span></button>
                <button id="clear-button" class="secondary-button" type="button" disabled><span class="inbox-long-label">Clear Selection</span><span class="inbox-short-label">清空</span></button>
                <button id="import-button" class="primary-button" type="button" disabled><span class="inbox-long-label">Archive Selected</span><span class="inbox-short-label">归档</span></button>
                <button id="skip-button" class="secondary-button danger-button" type="button" disabled><span class="inbox-long-label">Skip Selected</span><span class="inbox-short-label">跳过</span></button>
            </div>
        </div>
        <p id="inbox-message" class="import-status inbox-feedback" role="status" aria-live="polite"></p>
        <button id="select-failed-button" class="secondary-button" type="button" hidden disabled>选择本页失败项</button>
        <details id="import-results" class="inbox-results" aria-label="最近处理结果" hidden>
            <summary>最近处理结果</summary>
            <p id="import-results-summary"></p>
            <ol id="import-results-list"></ol>
            <a class="back-link" href="/">返回 Gallery</a>
        </details>
        <div id="inbox-list" class="inbox-list" aria-live="polite"></div>
        <nav class="inbox-pagination" aria-label="Inbox 分页">
            <button id="inbox-previous" class="secondary-button" type="button" disabled>Previous</button>
            <span id="inbox-page-status" role="status"></span>
            <button id="inbox-next" class="secondary-button" type="button" disabled>Next</button>
        </nav>
        <div id="inbox-state" class="state-panel" role="status" hidden>
            <h2 id="inbox-state-title"></h2>
            <p id="inbox-state-message"></p>
            <button id="inbox-retry-button" class="secondary-button" type="button" hidden>重新加载</button>
        </div>
    </section>
</main>
</body>
</html>
