<!doctype html>
<html lang="zh-CN" class="gallery-document">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Illustration Archive</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/image-viewer.js" defer></script>
    <script src="/browse-context.js" defer></script>
    <script src="/masonry-layout.js" defer></script>
    <script src="/metadata-picker.js" defer></script>
    <script src="/app.js" defer></script>
</head>
<body class="gallery-page">
<header class="browse-toolbar">
    <a class="archive-brand" href="/">Illustration Archive</a>
    <form id="gallery-search-form" class="gallery-search" role="search">
        <label for="gallery-search-input" class="visually-hidden">搜索收藏库</label>
        <input id="gallery-search-input" type="search" placeholder="搜索收藏库" maxlength="200" autocomplete="off">
        <button type="submit" aria-label="搜索收藏库">搜索</button>
    </form>
    <div class="gallery-facet-controls">
        <button id="gallery-facet-toggle" class="facet-button facet-mobile" type="button" aria-expanded="false" aria-controls="gallery-facet-panel">筛选 ▾</button>
        <button id="gallery-author-toggle" class="facet-button facet-desktop" type="button" aria-expanded="false" aria-controls="gallery-author-panel">作者 ▾</button>
        <button id="gallery-tag-toggle" class="facet-button facet-desktop" type="button" aria-expanded="false" aria-controls="gallery-tag-panel">标签 ▾</button>
        <div id="gallery-facet-panel" class="gallery-facet-panel" hidden>
            <section id="gallery-author-panel" class="metadata-picker-panel" aria-label="筛选作者" hidden>
                <div class="metadata-picker-heading"><strong>作者</strong><button id="gallery-author-clear" class="facet-button" type="button">不限作者</button></div>
                <div class="metadata-picker-search">
                    <label class="visually-hidden" for="gallery-author-search-input">搜索作者</label>
                    <input id="gallery-author-search-input" type="search" placeholder="搜索作者" autocomplete="off">
                    <button id="gallery-author-search-button" class="secondary-button" type="button">搜索</button>
                </div>
                <p id="gallery-author-search-status" class="detail-edit-status" aria-live="polite"></p>
                <ul id="gallery-author-search-results" class="metadata-picker-results"></ul>
                <button id="gallery-author-more" class="secondary-button" type="button" hidden>加载更多</button>
            </section>
            <section id="gallery-tag-panel" class="metadata-picker-panel" aria-label="筛选标签" hidden>
                <div class="metadata-picker-heading"><strong>标签</strong><button id="gallery-tag-clear" class="facet-button" type="button">不限标签</button></div>
                <div class="metadata-picker-search">
                    <label class="visually-hidden" for="gallery-tag-search-input">搜索标签</label>
                    <input id="gallery-tag-search-input" type="search" placeholder="搜索标签" autocomplete="off">
                    <button id="gallery-tag-search-button" class="secondary-button" type="button">搜索</button>
                </div>
                <p id="gallery-tag-search-status" class="detail-edit-status" aria-live="polite"></p>
                <ul id="gallery-tag-search-results" class="metadata-picker-results"></ul>
                <button id="gallery-tag-more" class="secondary-button" type="button" hidden>加载更多</button>
            </section>
            <button id="gallery-facet-close" class="facet-button" type="button">收起筛选</button>
        </div>
    </div>
    <span id="total-count" class="total-count"></span>
    <p id="load-status" class="load-status" aria-live="polite">正在加载…</p>
    <button id="import-toggle" class="browse-import-toggle" type="button" aria-expanded="false"
            aria-controls="import-panel">导入插画</button>
    <details class="browse-more">
        <summary aria-label="更多操作">⋯</summary>
        <div class="browse-more-menu"><a href="/x-import.html">X Import →</a></div>
    </details>
</header>
<main class="page-shell">
    <h1 class="visually-hidden">插画图库</h1>

    <div id="gallery-filters" class="gallery-filters" aria-label="当前筛选条件" hidden></div>

    <section id="import-panel" class="import-section" aria-labelledby="import-heading" hidden>
        <div class="section-heading">
            <div>
                <h2 id="import-heading">导入插画</h2>
                <p class="section-description">一次选择多个文件，加入你的个人归档。</p>
            </div>
        </div>

        <div class="import-controls">
            <label class="file-input-label" for="import-files">选择文件</label>
            <input id="import-files" class="file-input" type="file" multiple
                   accept=".jpg,.jpeg,.png,.gif,image/jpeg,image/png,image/gif">
            <button id="import-button" class="primary-button import-button" type="button" disabled>开始导入</button>
        </div>

        <p id="selected-files-count" class="selection-summary" aria-live="polite">尚未选择文件</p>
        <ul id="selected-files-list" class="selected-files-list" hidden></ul>
        <p id="import-status" class="import-status" role="status" aria-live="polite"></p>

        <div id="import-result" class="import-result" hidden>
            <div class="import-result-summary" aria-label="导入统计">
                <span>总数 <strong id="import-total">0</strong></span>
                <span>成功 <strong id="import-success-count">0</strong></span>
                <span>失败 <strong id="import-failure-count">0</strong></span>
            </div>
            <ul id="import-items" class="import-items"></ul>
        </div>
    </section>

    <section aria-labelledby="gallery-heading">
        <h2 id="gallery-heading" class="visually-hidden">全部插画</h2>

        <div id="gallery" class="gallery" aria-busy="true"></div>

        <div id="state-panel" class="state-panel" role="status" hidden>
            <h3 id="state-title"></h3>
            <p id="state-message"></p>
            <button id="retry-button" class="secondary-button" type="button" hidden>重新加载</button>
        </div>
    </section>

    <nav class="pagination" aria-label="图库分页">
        <button id="previous-button" class="secondary-button" type="button">上一页</button>
        <span id="page-info" class="page-info" aria-live="polite">第 0 / 0 页</span>
        <button id="next-button" class="primary-button" type="button">下一页</button>
    </nav>
</main>
</body>
</html>
