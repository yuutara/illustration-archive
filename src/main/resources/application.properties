spring.application.name=illustration-archive

# Local values belong in config/application-local.properties, which Git ignores.
# Environment variables with the same settings take precedence and suit deployment.
# The desktop PoC points this at its own data directory so it never reads the MySQL setup.
spring.config.import=optional:file:${illustration-archive.local-config:./config/application-local.properties}

spring.datasource.url=${ILLUSTRATION_ARCHIVE_DB_URL}
spring.datasource.username=${ILLUSTRATION_ARCHIVE_DB_USERNAME}
spring.datasource.password=${ILLUSTRATION_ARCHIVE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis serves the gallery list read; all other SQL uses JdbcTemplate in the same Spring transactions.
# Statement scope turns off the per-transaction local cache, so a MyBatis read repeated after a JdbcTemplate
# write in one transaction sees that write instead of the cached first result.
mybatis.configuration.local-cache-scope=statement

# Image storage root used by FileStorageService. Database records store relative
# storage_key values, never machine-specific paths.
illustration-archive.storage.root-dir=${ILLUSTRATION_ARCHIVE_STORAGE_ROOT}
storage.type=${ILLUSTRATION_ARCHIVE_STORAGE_TYPE:local}
storage.s3.endpoint=${ILLUSTRATION_ARCHIVE_S3_ENDPOINT:}
storage.s3.region=${ILLUSTRATION_ARCHIVE_S3_REGION:}
storage.s3.access-key=${ILLUSTRATION_ARCHIVE_S3_ACCESS_KEY:}
storage.s3.secret-key=${ILLUSTRATION_ARCHIVE_S3_SECRET_KEY:}
storage.s3.bucket=${ILLUSTRATION_ARCHIVE_S3_BUCKET:}
storage.s3.path-style=${ILLUSTRATION_ARCHIVE_S3_PATH_STYLE:false}

spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=500MB

# X access stays disabled unless explicitly enabled and local OAuth credentials are supplied.
x.api.enabled=${X_API_ENABLED:false}
x.api.base-url=${X_API_BASE_URL:https://api.x.com}
x.api.default-page-size=${X_API_DEFAULT_PAGE_SIZE:5}
x.api.default-max-pages=${X_API_DEFAULT_MAX_PAGES:3}
# Combined sync: resumable Recent (plus an optional head probe), then History; all share the budget.
x.sync.recent-page-size=${X_SYNC_RECENT_PAGE_SIZE:25}
x.sync.recent-max-pages=${X_SYNC_RECENT_MAX_PAGES:2}
x.sync.max-pages=${X_SYNC_MAX_PAGES:6}
x.sync.max-scanned=${X_SYNC_MAX_SCANNED:100}
x.sync.max-new=${X_SYNC_MAX_NEW:50}
x.oauth.client-id=${X_OAUTH_CLIENT_ID:}
x.oauth.client-secret=${X_OAUTH_CLIENT_SECRET:}
x.oauth.credential-file=${X_OAUTH_CREDENTIAL_FILE:./config/x-oauth-tokens.properties}

# Optional, manual Detail experiment. Keys belong only in local config or process environment.
ai.analysis.enabled=${AI_ANALYSIS_ENABLED:false}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
ai.analysis.timeout-seconds=${AI_ANALYSIS_TIMEOUT_SECONDS:90}
